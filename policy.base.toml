# Base mutation-safety policy of the Revit MCP server (Phase 7, D-14..D-17).
#
# Closed vocabulary: a route is classified here or it is denied (unknown_route).
# decision: allow | confirm | deny | check.  check names a built-in Python check, never an
# expression.  facts names the read-only preflight facts a confirmation window may show.
# Every key below is a route as the bridge addresses it (first path segment, slashes both
# sides); tools map to the route keys their transport calls address.
schema = 1

[settings]
confirm_timeout_s = 300
permit_ttl_s = 60
# D-22: the company shared-parameter file; the file is not read by this plan.
shared_parameters_file = '\\Srv-dfs\BIM\01_Ресурсы плагинов\2_Shared_parameters\ГП_ФОП2025.txt'

